name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Routing eval gates (also enforced inside npm test). This step adds the
      # per-category printout and the JSON report artifact for review.
      - name: Routing eval
        run: npm run eval

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-eval-report
          path: evals/reports/latest.json
          if-no-files-found: warn

      - name: Build
        run: npm run build

      # The scan must stay re-runnable: a second pass over unchanged fixtures
      # should find nothing new. A regression here means the daily worker
      # would reprocess and re-notify every review, every day.
      - name: Daily scan is idempotent
        run: |
          npm run scan
          npm run scan | tee second-scan.log
          grep -q "0 review(s) processed" second-scan.log
